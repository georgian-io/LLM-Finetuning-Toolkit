name: PyPI CD
on:
  release:
    types: [published]
jobs:
  pypi:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-toolkit
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      # ----------------
      # Set Up
      # ----------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Cloudsmith package access
        uses: georgian-io/terraform-infra/.github/actions/setup-cloudsmith@0be379908cc2dda36c063a4720fb3d073f39efb8
        with:
          python-repository: georgian-main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ----------------
      # Install Deps
      # ----------------
      # Poetry has no environment setting for its package index. Export the
      # exact locked versions with their hashes and let pip install them
      # through the configured index (PIP_INDEX_URL); nothing is re-resolved.
      # The versioning plugin is installed with pip too, into Poetry's own
      # environment, where Poetry discovers it.
      - name: Install Dependencies
        run: |
          python -m pip install poetry==1.5.1 poetry-plugin-export "poetry-dynamic-versioning[plugin]"
          poetry export --with dev --format requirements.txt --output "$RUNNER_TEMP/requirements.txt"
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # ----------------
      # Build & Publish
      # ----------------
      - name: Build
        run: poetry build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
