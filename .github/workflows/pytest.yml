name: pytest CI
on: pull_request
jobs:
  pytest:
    name: Run pytest and check min coverage threshold (80%)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # ----------------
      # Set Up
      # ----------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Cloudsmith package access
        uses: georgian-io/global-github-actions-public/.github/actions/setup-cloudsmith@31d12c08e31d2c1a4270172c704428efcdffbe55
        with:
          python-repository: georgian-main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ----------------
      # Install Deps
      # ----------------
      # Poetry has no environment setting for its package index. Export the
      # exact locked versions with their hashes and let pip install them
      # through the configured index (PIP_INDEX_URL); nothing is re-resolved.
      - name: Install Dependencies
        run: |
          python -m pip install poetry==1.5.1 poetry-plugin-export
          poetry export --with dev --format requirements.txt --output "$RUNNER_TEMP/requirements.txt"
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # ----------------
      # Run Test
      # ----------------
      - name: Run pytest
        run: poetry run pytest --cov=./ --cov-report=term
      - name: Check Coverage
        run: poetry run coverage report --fail-under=80
